name: MacDroid
options:
  bundleIdPrefix: dev.macdroid
  deploymentTarget:
    macOS: "14.0"
packages:
  MacDroidCore:
    path: MacDroidCore
targets:
  MacDroid:
    type: application
    platform: macOS
    sources: [MacDroid]
    dependencies:
      - package: MacDroidCore
    info:
      path: MacDroid/Info.plist
      properties:
        CFBundleDisplayName: MacDroid
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "4"
        LSUIElement: true
        NSLocalNetworkUsageDescription: MacDroid connects to your Android phone over your local network.
        NSBonjourServices: [_macdroid._tcp]
        CFBundleURLTypes:
          - CFBundleURLName: dev.macdroid.mac.tel
            CFBundleURLSchemes: [tel]
        NSServices:
          - NSMenuItem:
              default: Open on Phone
            NSMessage: openOnPhone
            NSPortName: MacDroid
            NSSendTypes:
              - public.utf8-plain-text
              - public.url
            NSRequiredContext: {}
    entitlements:
      path: MacDroid/MacDroid.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.server: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.macdroid.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
